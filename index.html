<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba mapa Navarra</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; }
    #mapa { height: 100%; }
    #aviso { position: absolute; top: 12px; left: 12px; z-index: 1; background: #fff;
             padding: 8px 12px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.25); font-size: 14px; }
  </style>
</head>
<body>
  <div id="aviso">Si ves un rectángulo azul sobre fondo gris, ¡todo funciona!</div>
  <div id="mapa"></div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    // Mapa sin fondo de calles: solo un color liso, como en los mapas de prensa
    const mapa = new maplibregl.Map({
      container: 'mapa',
      style: {
        version: 8,
        sources: {},
        layers: [{ id: 'fondo', type: 'background', paint: { 'background-color': '#eef0f2' } }]
      },
      center: [-1.65, 42.7],   // centro aproximado de Navarra
      zoom: 7.5
    });

    // Un rectángulo de prueba (NO son los límites reales de Navarra)
    const prueba = {
      type: 'FeatureCollection',
      features: [{
        type: 'Feature',
        properties: { nombre: 'Prueba' },
        geometry: { type: 'Polygon', coordinates: [[[-2.4, 42.2], [-0.9, 42.2], [-0.9, 43.3], [-2.4, 43.3], [-2.4, 42.2]]] }
      }]
    };

    mapa.on('load', () => {
      mapa.addSource('prueba', { type: 'geojson', data: prueba });
      mapa.addLayer({ id: 'prueba-relleno', type: 'fill', source: 'prueba',
                      paint: { 'fill-color': '#1f77b4', 'fill-opacity': 0.6 } });
      mapa.addLayer({ id: 'prueba-borde', type: 'line', source: 'prueba',
                      paint: { 'line-color': '#fff', 'line-width': 2 } });
    });
  </script>
</body>
</html>
